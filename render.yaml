services:
  - type: web
    name: kaamsetu
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn kaamsetu.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMAIL_VERIFICATION
        value: none
      # Secrets: enter these in the Render dashboard (sync: false = not stored in this file)
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
