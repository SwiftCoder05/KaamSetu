{% load static kaam %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}KaamSetu{% endblock %} · KaamSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% vstatic 'css/app.css' %}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a3a78'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='Georgia'>K</text></svg>">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <div class="toasts" id="toasts" aria-live="polite">
    {% for m in messages %}
      <div class="toast {% if m.tags == 'success' %}ok{% elif m.tags == 'error' %}bad{% elif m.tags == 'warning' %}warn{% endif %}" data-auto>
        <span>{{ m }}</span><button type="button" aria-label="Dismiss" onclick="this.parentElement.remove()">×</button>
      </div>
    {% endfor %}
  </div>
  <script src="{% vstatic 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
