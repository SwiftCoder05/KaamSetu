{% load kaam %}
<div class="card stack" style="--gap:.5rem">
  <div class="row between">
    <label class="row grow select-check" style="gap:.5rem;align-items:flex-start">
      <input type="checkbox" name="ids" value="{{ r.pk }}" aria-label="Select {{ r.title }}">
    </label>
    <a class="grow" href="{% url 'resume_workspace' r.pk %}"><h3>{{ r.title }}</h3></a>
    <a href="{% url 'resume_workspace' r.pk %}" aria-label="Open {{ r.title }}">{% icon 'arrow' 16 %}</a>
  </div>
  <div class="small muted">{{ r.versions.count }} version{{ r.versions.count|pluralize }} · updated {{ r.updated_at|timesince }} ago</div>
  {% if r.original_name %}<div class="tiny muted">{% icon 'lock' 12 %} Original: {{ r.original_name }}</div>{% endif %}
  <div class="row" style="gap:.4rem" data-category-editor="{% url 'resume_set_category' r.pk %}">
    <input type="text" value="{{ r.category }}" list="resume-categories" placeholder="Category, e.g. Software Engineer" maxlength="80" aria-label="Category for {{ r.title }}" style="flex:1">
    <button class="btn sm ghost" type="button">Save</button>
  </div>
</div>
